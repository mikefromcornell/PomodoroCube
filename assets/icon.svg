<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="PomodoroCube app icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#fff7ee"/>
      <stop offset="1" stop-color="#f0d6b6"/>
    </linearGradient>
    <linearGradient id="front" x1="0.05" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fffdfa"/>
      <stop offset="1" stop-color="#e8e0d4"/>
    </linearGradient>
    <linearGradient id="topf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#fffdfa"/>
      <stop offset="1" stop-color="#efe7dc"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0" stop-color="#e4dbcf"/>
      <stop offset="1" stop-color="#c8bcab"/>
    </linearGradient>
    <linearGradient id="scr" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#251a12"/>
      <stop offset="1" stop-color="#0c0806"/>
    </linearGradient>
    <radialGradient id="floor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a9762f" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#a9762f" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#a9762f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- floor shadow -->
  <ellipse cx="258" cy="462" rx="205" ry="34" fill="url(#floor)"/>

  <!-- ============ cube: front 250x250, depth vector (+70,-56) ============ -->
  <!-- top face -->
  <path d="M100 200 L350 200 L420 144 L170 144 Z" fill="url(#topf)"/>
  <!-- right face -->
  <path d="M350 200 L420 144 L420 394 L350 450 Z" fill="url(#side)"/>
  <!-- front face -->
  <path d="M100 200 L350 200 L350 450 L100 450 Z" fill="url(#front)"/>

  <!-- "30" print, laid into the top face's plane -->
  <g transform="translate(260 172) rotate(-26.57) scale(1 0.5)">
    <text x="0" y="24" font-family="Helvetica,Arial,sans-serif" font-size="76" font-weight="700"
          fill="#b0a08e" text-anchor="middle" letter-spacing="-3">30</text>
  </g>

  <!-- ============ display ============ -->
  <g>
    <rect x="117" y="217" width="216" height="216" rx="44" fill="url(#scr)"/>
    <rect x="117" y="217" width="216" height="216" rx="44" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="3"/>
    <g fill="none" stroke-linecap="round" transform="translate(225 325) rotate(-90)">
      <circle r="80" stroke="#ffffff" stroke-opacity="0.10" stroke-width="13"/>
      <circle r="80" stroke="#ff8a1f" stroke-width="13" pathLength="100" stroke-dasharray="74 100"/>
    </g>
    <text x="225" y="343" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="44" font-weight="700"
          fill="#fff8ec" text-anchor="middle" letter-spacing="-2">30:00</text>
  </g>

  <!-- ============ face highlights ============ -->
  <path d="M100 200 L350 200 L350 450 L100 450 Z" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/>
  <path d="M100 200 L170 144 L420 144" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3"/>
  <path d="M350 200 L350 450" fill="none" stroke="#000000" stroke-opacity="0.06" stroke-width="3"/>
</svg>
